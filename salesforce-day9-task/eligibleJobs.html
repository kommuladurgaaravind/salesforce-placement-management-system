<template>
    <div class="eligible-jobs-container">
        <div class="eligible-jobs-header">
            <h2>Eligible Jobs</h2>
            <p>Opportunities matching your profile</p>
        </div>
        <div class="eligible-jobs-list">
            <template for:each={jobs} for:item="job">
                <c-job-card key={job.Id} job={job} onapply={handleApply}></c-job-card>
            </template>
        </div>
    </div>
</template>
